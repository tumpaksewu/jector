name: Jector
options:
  bundleIdPrefix: app.aleko
  deploymentTarget:
    iOS: '17.0'
packages:
  ProjectorCore:
    path: Core
  ProjectorInference:
    path: Inference
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.4.1'
    CURRENT_PROJECT_VERSION: '5'
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Jector:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ProjectorCore
      - package: ProjectorInference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.aleko.ProjectorRemote
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Find and control your projector over Wi-Fi using ADB.
        NSMicrophoneUsageDescription: Speak English or Russian commands to control your projector.
        NSSpeechRecognitionUsageDescription: Transcribe projector commands on this iPhone without cloud recognition.
schemes:
  Jector:
    build:
      targets:
        Jector: all
    run:
      config: Debug
